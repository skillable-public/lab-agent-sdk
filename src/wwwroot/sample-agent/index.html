<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sample Lab Agent</title>
  <link rel="stylesheet" href="../shared/variables-common.css" />
  <link rel="stylesheet" href="agent.css" />
  <script>
    // Apply ?theme= before first paint, so there is no flash of the wrong theme.
    (function () {
      const theme = new URLSearchParams(location.search).get('theme');
      if (['light', 'dark', 'highcontrast'].includes(theme)) document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <header class="bar">
    <span class="bar__title">Sample Lab Agent</span>
    <span class="bar__status" id="status">Connecting</span>
  </header>
  <ul class="messages" id="messages" aria-live="polite"></ul>
  <div class="actions">
    <button type="button" class="action" id="btn-screenshot" hidden>Look at my screen</button>
    <button type="button" class="action" id="btn-keys" hidden>Open the Run dialog</button>
  </div>
  <form class="composer" id="composer" autocomplete="off">
    <label class="sr-only" for="input">Message</label>
    <input id="input" class="composer__input" type="text" placeholder="Ask the agent" />
    <button type="submit" class="composer__send">Send</button>
  </form>
  <script src="agent.js"></script>
</body>
</html>
